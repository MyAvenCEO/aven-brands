name: Install dependencies
description: >-
  Authenticate to GitHub Packages, then install with a frozen lockfile.

  ONE place, because @myavenceo/* is private and three workflows install.
  Each of them used to write the token itself, which is how the site deploy
  went out without one: the dependency became private and only two of the
  three files learned about it.

  Assumes bun is already set up — every caller pins its own bun-version.

inputs:
  token:
    description: >-
      Token used to read @myavenceo/* from GitHub Packages. Pass the calling
      job's secrets.GITHUB_TOKEN; the job needs `permissions: packages: read`.
    required: true

runs:
  using: composite
  steps:
    - name: Authenticate to GitHub Packages
      shell: bash
      # The PROJECT .npmrc, because it is the only place bun reads a token
      # from. Three alternatives were measured against a registry that logs
      # its Authorization header, and none of them work:
      #
      #   env vars (npm_config_*, NODE_AUTH_TOKEN, BUN_AUTH_TOKEN)
      #     ignored entirely by bun 1.3.13.
      #
      #   `_authToken=${NODE_AUTH_TOKEN}` in the tracked file
      #     with the variable unset, bun sends the LITERAL string
      #     "${NODE_AUTH_TOKEN}" as the token — so a developer's own login is
      #     not merely ignored, it is replaced by nonsense.
      #
      #   $HOME/.npmrc
      #     bun does not read it under Actions. Not the token — the whole
      #     file. Pointing a scope's registry at a dead host from $HOME and
      #     watching bun go to npm.pkg.github.com anyway is how that was
      #     settled. On a laptop it reads the file perfectly (1.3.13 and
      #     1.4.0, merged with a project file, on the frozen path,
      #     last-duplicate-wins), which is exactly why this cost four failed
      #     runs: the step writes the file, reports success, and the install
      #     then fails with a 401 that reads like a permissions problem.
      #
      # `skip-worktree` is what keeps the token out of a commit — git treats
      # the file as unchanged, so `git add -A` cannot stage it. That, not the
      # file's location, is what made the old leak possible.
      run: |
        set -euo pipefail
        printf '//npm.pkg.github.com/:_authToken=%s\n' '${{ inputs.token }}' >> .npmrc
        git update-index --skip-worktree .npmrc
    - shell: bash
      run: bun install --frozen-lockfile
    - name: Refuse to proceed if a credential reached the checkout
      shell: bash
      run: |
        set -euo pipefail
        # Written as a character class so this file does not match itself.
        pattern='_authToken=[a-z]\{2,4\}_'
        if git diff --cached | grep -q "$pattern"; then
          echo "::error::A registry token is staged for commit."
          exit 1
        fi
        if git grep --cached -nI "$pattern" -- . >/dev/null 2>&1; then
          echo "::error::A registry token is committed in a tracked file."
          exit 1
        fi

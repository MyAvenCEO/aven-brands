name: Publish static site

on:
  push:
    branches: [next, production]

permissions:
  contents: write
  # The site's dependencies now include a private package. Without this the
  # install 401s and nothing deploys.
  packages: read

concurrency:
  group: static-site-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Authenticate to GitHub Packages
        shell: bash
        # This build never needed a registry token: the site used the workspace
        # copy of aven-ceo, and everything else was public. aven-ceo now depends
        # on @myavenceo/aven-vibes, which is private, so the install reaches the
        # registry for the first time.
        #
        # The token goes in the project .npmrc, where bun reads it, and
        # `skip-worktree` keeps git from ever staging it.
        run: |
          set -euo pipefail
          printf '//npm.pkg.github.com/:_authToken=%s\n' '${{ secrets.GITHUB_TOKEN }}' >> .npmrc
          git update-index --skip-worktree .npmrc
      - run: bun install --frozen-lockfile

      - id: target
        name: Select environment and deployment branch
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            next)
              environment=next
              deploy_branch=deploy/next
              ;;
            production)
              environment=production
              deploy_branch=deploy/production
              ;;
            *)
              echo "::error::Unsupported source branch: $GITHUB_REF_NAME"
              exit 1
              ;;
          esac
          echo "environment=$environment" >> "$GITHUB_OUTPUT"
          echo "deploy_branch=$deploy_branch" >> "$GITHUB_OUTPUT"

      - name: Build and audit complete static site
        run: bun run "build:${{ steps.target.outputs.environment }}"

      - name: Record artifact provenance
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/website/dist/index.html
          printf '%s\n' "$GITHUB_SHA" > apps/website/dist/.source-revision
          printf '%s\n' "${{ steps.target.outputs.environment }}" > apps/website/dist/.environment

      - name: Publish dist to deployment branch
        env:
          DEPLOY_BRANCH: ${{ steps.target.outputs.deploy_branch }}
        shell: bash
        run: |
          set -euo pipefail
          publish_dir="$RUNNER_TEMP/static-site"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git fetch origin "$DEPLOY_BRANCH"; then
            git worktree add -B "$DEPLOY_BRANCH" "$publish_dir" "origin/$DEPLOY_BRANCH"
          else
            git worktree add --detach "$publish_dir"
            git -C "$publish_dir" switch --orphan "$DEPLOY_BRANCH"
          fi

          git -C "$publish_dir" rm -r --ignore-unmatch .
          install -d "$publish_dir/dist"
          cp -a apps/website/dist/. "$publish_dir/dist/"
          git -C "$publish_dir" add -A

          if git -C "$publish_dir" diff --cached --quiet; then
            echo "Deployment artifact is already current."
            exit 0
          fi

          git -C "$publish_dir" commit -m "build(${GITHUB_REF_NAME}): ${GITHUB_SHA}"
          git -C "$publish_dir" push origin "HEAD:refs/heads/$DEPLOY_BRANCH"

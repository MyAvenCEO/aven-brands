name: CI

on:
  pull_request:
    branches: [main, next, production]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - name: Build and audit next
        run: bun run build:next
      - name: Build and audit production
        run: bun run build:production
      - run: bun run lint
      - name: Verify generated brand files are in sync
        # tokens.ts is the only place a hex is spelled; every theme, favicon and
        # icon primitive is generated from it and committed. If someone edits a
        # generated file directly, regenerating restores it and the tree goes
        # dirty — this is where that gets caught, before it can be published.
        run: |
          bun run brand:generate
          git diff --exit-code
      - name: Verify publishable package
        working-directory: packages/aven-ceo
        run: npm pack --dry-run

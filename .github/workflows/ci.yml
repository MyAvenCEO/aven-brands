name: CI

on:
  pull_request:
    branches: [main, next, production]
  push:
    branches: [main]

permissions:
  contents: read
  # The guideline pages are rendered by @myavenceo/aven-vibes, which is private.
  # Without this the install 401s and every run is red.
  packages: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - name: Authenticate to GitHub Packages
        shell: bash
        # The PROJECT .npmrc, because that is the only file bun reads a token
        # from. $HOME/.npmrc looks strictly safer and is not: bun ignores it and
        # every install 401s, which reads as a permissions problem for as long
        # as it takes someone to notice the file location changed.
        #
        # `skip-worktree` is what keeps it out of a commit — git treats the file
        # as unchanged, so `git add -A` cannot stage it.
        run: |
          set -euo pipefail
          printf '//npm.pkg.github.com/:_authToken=%s\n' '${{ secrets.GITHUB_TOKEN }}' >> .npmrc
          git update-index --skip-worktree .npmrc
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - name: Build and audit next
        run: bun run build:next
      - name: Build and audit production
        run: bun run build:production
      - run: bun run lint
      - name: Verify generated brand files are in sync
        # A brand definition is the only place a hex is spelled; every theme,
        # favicon, icon primitive and guideline page is generated from one and
        # committed. If someone edits a generated file directly, regenerating
        # restores it and the tree goes dirty — this is where that gets caught,
        # before it can be published.
        #
        # `guidelines` is included because it was not, briefly, and a brand could
        # have changed while its own documentation kept describing the old one.
        run: |
          bun run build:packages
          bun run guidelines
          git diff --exit-code
      - name: Verify every package is publishable
        # All three, not just the one that used to be the only one.
        run: |
          set -euo pipefail
          for pkg in packages/*/; do
            echo "── $pkg"
            (cd "$pkg" && npm pack --dry-run)
          done

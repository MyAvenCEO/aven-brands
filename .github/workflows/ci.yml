name: CI

on:
  pull_request:
    branches: [main, next, production]
  push:
    branches: [main]

permissions:
  contents: read
  # The guideline pages are rendered by @myavenceo/aven-vibes, which is private.
  # Without this the install 401s and every run is red.
  packages: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: ./.github/actions/bun-install
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: bun run check
      - run: bun run test
      - name: Build and audit next
        run: bun run build:next
      - name: Build and audit production
        run: bun run build:production
      - run: bun run lint
      - name: Verify generated brand files are in sync
        # A brand definition is the only place a hex is spelled; every theme,
        # favicon, icon primitive and guideline page is generated from one and
        # committed. If someone edits a generated file directly, regenerating
        # restores it and the tree goes dirty — this is where that gets caught,
        # before it can be published.
        #
        # The guideline page used to be generated here too. It is gone: the
        # storybook at /docs/brand replaced it, reads the unit registry directly,
        # and cannot go stale the way a committed HTML file can.
        run: |
          bun run build:packages
          git diff --exit-code
      - name: Verify every package is publishable
        # All three, not just the one that used to be the only one.
        run: |
          set -euo pipefail
          # `brands/*/design-system`, not `packages/*` — the restructure moved
          # every publishable package under its own brand, and this loop kept
          # globbing a directory that no longer exists. A glob that matches
          # nothing expands to itself, so the step failed on `cd packages/*/`
          # rather than quietly passing, which is the one good thing about it.
          for pkg in brands/*/design-system/; do
            echo "── $pkg"
            (cd "$pkg" && npm pack --dry-run)
          done

name: Publish a brand package

# One workflow for every package in the repo. The tag names which one:
#   aven-ceo-v0.6.0   -> brands/CEO/design-system
#   aven-yma-v0.1.0   -> brands/YMA/design-system
#
# The machinery is not here. It lives in avenVIBES, beside the runtime it is
# half of, and publishes from that repo.
#
# It used to be hardcoded to aven-ceo, which was fine while that was the only
# package and would have meant a copy of this file per brand from now on.

on:
  push:
    tags:
      - aven-ceo-v*
      - aven-yma-v*

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@myavenceo'
      - uses: ./.github/actions/bun-install
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Work out which package the tag names
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          # aven-ceo-v0.10.0 -> brands/CEO/design-system
          name="${GITHUB_REF_NAME%-v*}"
          brand="${name#aven-}"
          dir="brands/$(printf '%s' "$brand" | tr '[:lower:]' '[:upper:]')/design-system"
          test -d "$dir" || { echo "no such brand package: $dir"; exit 1; }
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
      - name: Require tag and package versions to match
        shell: bash
        run: |
          set -euo pipefail
          name='${{ steps.pkg.outputs.name }}'
          package_version=$(node -p "require('./${{ steps.pkg.outputs.dir }}/package.json').version")
          test "$GITHUB_REF_NAME" = "$name-v$package_version"
      - name: Refuse to publish generated files that drifted
        # The package ships committed, generated assets (the icon primitives) and
        # the theme its consumers regenerate from. If a hex was edited anywhere but
        # tokens.ts, regenerating restores it and the tree goes dirty — so this is
        # the one place that has to notice, before a stale artifact reaches anyone.
        #
        # `bun run guidelines` used to run here too. That script and its renderer
        # were deleted in 3274d7a when the storyboard at /docs/brand superseded
        # the generated guideline page, but this workflow kept calling it — so
        # every publish since has failed on `Script not found "guidelines"`
        # before reaching npm. `build:packages` + `git diff` is the drift proof;
        # the removed line added nothing to it.
        run: |
          set -euo pipefail
          bun run build:packages
          git diff --exit-code
      - name: The public surface must be intact before publishing
        # 0.4.0 shipped without elementCss -- deleted as collateral when a
        # neighbouring function was removed -- and the failure surfaced in
        # another repository's build. Cheaper to catch here.
        run: bun run test
      - name: Publish compiled package
        working-directory: ${{ steps.pkg.outputs.dir }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish

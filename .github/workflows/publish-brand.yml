name: Publish aven-brand

on:
  push:
    tags: [aven-brand-v*]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@myavenceo'
      - run: bun install --frozen-lockfile
      - name: Require tag and package versions to match
        shell: bash
        run: |
          set -euo pipefail
          package_version=$(node -p "require('./packages/aven-brand/package.json').version")
          test "$GITHUB_REF_NAME" = "aven-brand-v$package_version"
      - run: bun run --cwd packages/aven-brand build
      - name: Publish compiled package
        working-directory: packages/aven-brand
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm publish

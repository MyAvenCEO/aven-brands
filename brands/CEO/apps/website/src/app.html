<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="text-scale" content="scale">
		<!-- Brand faces are self-hosted (see app.css @font-face) — no remote font
		     CDN. Preload the two files so the first paint has them. -->
		<link
			rel="preload"
			href="/fonts/GoogleSansFlex-latin.woff2"
			as="font"
			type="font/woff2"
			crossorigin
		>
		<link rel="preload" href="/fonts/FogtwoNo5.otf" as="font" type="font/otf" crossorigin>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="off">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
